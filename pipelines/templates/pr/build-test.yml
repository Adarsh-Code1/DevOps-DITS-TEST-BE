parameters:
  - name: solution
    type: string

  - name: nugetConfig
    type: string

  - name: scanSource
    type: string

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: dotnet pack server/building-blocks/BuildingBlocks.slnx --configuration Release
    displayName: Build and pack shared BuildingBlocks

  - script: dotnet restore ${{ parameters.solution }} --configfile ${{ parameters.nugetConfig }}
    displayName: Restore solution

  - task: DotNetCoreCLI@2
    displayName: Build solution
    inputs:
      command: build
      projects: ${{ parameters.solution }}
      arguments: '--configuration Release --no-restore'

  - task: DotNetCoreCLI@2
    displayName: Run unit tests and collect coverage
    inputs:
      command: test
      projects: ${{ parameters.solution }}
      arguments: '--configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"'
      publishTestResults: true

  - task: PublishCodeCoverageResults@2
    displayName: Publish code coverage
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
      failIfCoverageEmpty: true

  - script: |
      mkdir -p "$(Build.SourcesDirectory)/reports/owasp-depscan"

      docker run --rm \
        -v "$(Build.SourcesDirectory):/app" \
        public.ecr.aws/appthreat/dep-scan:latest \
        --src "/app/${{ parameters.scanSource }}" \
        --reports-dir /app/reports/owasp-depscan
    displayName: Run OWASP Dependency Scan

  - task: PublishPipelineArtifact@1
    displayName: Publish OWASP Scan Reports
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/reports/owasp-depscan'
      artifact: 'owasp-depscan-report'
      publishLocation: pipeline
